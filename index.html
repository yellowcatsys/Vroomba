<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sweepy's Big Clean</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#221C38;--deep:#171230;--panel:#2E2650;--panel2:#3A3163;--line:#ffffff1a;--cream:#FFF6E6;--muted:#C9BFE6;--teal:#2EC4B6;--teal-d:#17897F;--blue:#5AB4FF;--blue-d:#2F7FCB;--gold:#FFC857;--red:#FF5A5F;--green:#7BD35A;color-scheme:dark}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--cream);font:600 14px/1.45 Nunito,system-ui,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;padding-inline:16px;padding-block:10px 14px;gap:10px;box-sizing:border-box}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.brand{display:flex;align-items:center;gap:10px}
.logo{font:800 24px/1 'Baloo 2',system-ui,sans-serif;color:var(--gold)}
.chip{font:800 11px/1 Nunito,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:#ffffff10;padding:6px 9px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.meters{display:flex;flex-wrap:wrap;gap:8px 12px;flex:1 1 420px;min-width:0}
.meter{flex:1 1 76px;min-width:70px;max-width:130px}
.meter .lab{display:flex;justify-content:space-between;font:800 10.5px/1 Nunito,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.meter .lab b{color:var(--cream);font-variant-numeric:tabular-nums;letter-spacing:0}
.bar{height:9px;border-radius:6px;background:var(--deep);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line);position:relative}
.bar i{display:block;height:100%;width:0;background:var(--c);border-radius:6px}
.meter.warn .bar i{animation:warn .5s steps(2) infinite}
.meter.warn .lab{color:var(--red)}
@keyframes warn{50%{opacity:.3}}
.meter.clean{flex:2 1 150px;max-width:240px}
.clean .bar{height:12px;overflow:visible}
.clean .goal{position:absolute;left:90%;top:-3px;bottom:-3px;width:2px;border-radius:2px;background:var(--cream);opacity:.8}
.side{display:flex;align-items:center;gap:8px;margin-left:auto}
.wallet{font:800 20px/1 'Baloo 2',sans-serif;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.wallet small{font:800 12px Nunito,sans-serif;color:var(--green);margin-left:4px}
.wallet span{font:800 10.5px Nunito,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-left:5px}
button{font:inherit;color:inherit}
.btn{font:800 16px/1 'Baloo 2',system-ui,sans-serif;border:0;border-radius:14px;padding:11px 18px 9px;background:var(--teal);color:#0B2A28;cursor:pointer;box-shadow:0 4px 0 var(--teal-d);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--teal-d)}
.btn:focus-visible,.tab:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn.ghost{background:var(--panel2);color:var(--cream);box-shadow:0 4px 0 #0000004d}
.btn.mop{background:var(--blue);box-shadow:0 4px 0 var(--blue-d);color:#08223D}
.btn.sm{font-size:14px;padding:9px 13px 7px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.stage{position:relative;flex:1;min-height:0;border-radius:20px;overflow:hidden;background:var(--deep);box-shadow:inset 0 0 0 2px var(--line)}
#game{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#toast{position:absolute;left:50%;top:12px;transform:translate(-50%,-8px);background:#221C38f0;border:2px solid var(--line);padding:8px 14px;border-radius:12px;font-weight:800;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;width:max-content;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#powers{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.pw{font:800 12px/1 Nunito,sans-serif;padding:6px 10px;border-radius:999px;background:var(--c);color:#1a1530;font-variant-numeric:tabular-nums}
#hint{position:absolute;right:14px;bottom:12px;font-size:12px;color:var(--muted);pointer-events:none}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#171230c9;backdrop-filter:blur(4px);padding:16px;overflow:auto}
.card{width:100%;max-width:680px;background:var(--panel);border-radius:24px;padding:26px;box-sizing:border-box;box-shadow:0 24px 60px #0008,inset 0 0 0 2px var(--line)}
.title{font:800 clamp(36px,7vw,58px)/.9 'Baloo 2',system-ui,sans-serif;display:flex;flex-direction:column;margin:0 0 12px}
.title .t2{color:var(--gold)}
.sub{color:var(--muted);max-width:54ch;margin:0 0 18px;font-size:15px}
.menu-row{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.heroBot{width:132px;height:132px;flex:0 0 auto;border-radius:50%;background:radial-gradient(circle,#4A3F7A,#2E2650 70%)}
.how{list-style:none;margin:0;padding:0;display:grid;gap:7px;flex:1 1 280px;font-size:14px}
.how li{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:baseline}
.how kbd{font:800 10.5px/1.2 Nunito,sans-serif;letter-spacing:.05em;text-transform:uppercase;background:var(--deep);border-radius:6px;padding:4px 7px;color:var(--gold);box-shadow:inset 0 -2px 0 #0006;justify-self:start}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
h2{font:800 32px/1 'Baloo 2',sans-serif;margin:0}
.eyebrow{font:800 11px Nunito,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin:0 0 6px}
.stars{display:flex;gap:6px;font-size:44px;line-height:1;margin:14px 0 6px;color:#ffffff22}
.stars .on{color:var(--gold);text-shadow:0 3px 0 #C8901F}
.tally{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:6px;max-width:340px}
.tally li{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;color:var(--muted)}
.tally li b{color:var(--cream)}
.tally .tot{border-top:2px solid var(--line);padding-top:8px;margin-top:4px;font-size:17px;color:var(--cream)}
.tally .tot b{color:var(--gold);font:800 22px/1 'Baloo 2',sans-serif}
.note{color:var(--muted);font-size:13px;margin:14px 0 0}
.shop-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;margin:18px 0 14px;background:var(--deep);padding:4px;border-radius:14px;width:max-content;max-width:100%}
.tab{border:0;background:none;padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:800;color:var(--muted)}
.tab.on{background:var(--panel2);color:var(--cream)}
.uplist{display:grid;gap:8px}
.up{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;background:var(--panel2);border-radius:14px;padding:12px 14px}
.up h3{margin:0;font:800 17px/1.1 'Baloo 2',sans-serif}
.up p{margin:2px 0 0;color:var(--muted);font-size:13px}
.pips{display:flex;gap:4px}
.pips i{width:10px;height:10px;border-radius:3px;background:var(--deep)}
.pips i.on{background:var(--teal)}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.skin{background:var(--panel2);border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.skin canvas{width:78px;height:78px}
.skin h3{margin:0;font:800 15px/1.1 'Baloo 2',sans-serif}
.skin p{margin:0;color:var(--muted);font-size:12px}
.skin.eq{box-shadow:inset 0 0 0 2px var(--teal)}
.small-link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px;margin-left:auto;align-self:center}
@media (max-width:640px){#hint{display:none}.card{padding:20px}.up{grid-template-columns:1fr auto}.up .pips{grid-column:1}.how li{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.meter.warn .bar i{animation:none}#toast{transition:none}}
</style>

</head>
<body>
<div id="app">
  <header class="hud">
    <div class="brand"><span class="logo">Sweepy</span><span class="chip" id="lvl">Level 1 · 0:00</span></div>
    <div class="meters">
      <div class="meter" id="m-bat" style="--c:var(--green)"><div class="lab">Battery <b>100%</b></div><div class="bar"><i></i></div></div>
      <div class="meter" id="m-bin" style="--c:#C9A36B"><div class="lab">Dustbin <b>0/30</b></div><div class="bar"><i></i></div></div>
      <div class="meter" id="m-water" style="--c:var(--blue)"><div class="lab">Water <b>100%</b></div><div class="bar"><i></i></div></div>
      <div class="meter" id="m-hp" style="--c:var(--red)"><div class="lab">Health <b>100</b></div><div class="bar"><i></i></div></div>
      <div class="meter clean" id="m-clean" style="--c:var(--gold)"><div class="lab">House clean <b>0% · goal 90%</b></div><div class="bar"><i></i><span class="goal"></span></div></div>
    </div>
    <div class="side">
      <div class="wallet" id="wallet">0</div>
      <button class="btn sm" id="modeBtn" type="button">Vacuum</button>
      <button class="btn sm ghost" id="pauseBtn" type="button">Pause</button>
    </div>
  </header>
  <main class="stage" id="stage">
    <canvas id="game" aria-label="Game view: a house seen from above"></canvas>
    <div id="toast" role="status"></div>
    <div id="powers"></div>
    <div id="hint">Arrows / WASD to drive · Space to switch Vacuum ↔ Mop · or drag on the screen</div>
    <div class="overlay" id="ov"><div class="card" id="card"></div></div>
  </main>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('game'),ctx=cv.getContext('2d'),stage=$('stage');
const W=1400,H=900,T=14;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const TAU=Math.PI*2;

/* ================= MAP ================= */
const rooms=[
 {x:0,y:0,w:560,h:520,f:'wood',name:'Living Room',wt:1,lx:396,ly:500},
 {x:0,y:520,w:560,h:380,f:'carpet',name:'Bedroom',wt:.8,lx:392,ly:612},
 {x:560,y:0,w:840,h:460,f:'tile',name:'Kitchen',wt:1.5,lx:1170,ly:440},
 {x:560,y:460,w:440,h:440,f:'wood2',name:'Hallway',wt:.6,lx:830,ly:500},
 {x:1000,y:460,w:400,h:440,f:'bath',name:'Bathroom',wt:.6,lx:1030,ly:878},
];
const solids=[];
const addWall=(x,y,w,h)=>solids.push({x,y,w,h,k:'wall'});
function hwall(y,x1,x2,gaps=[]){let c=x1;for(const[a,b]of gaps){if(a>c)addWall(c,y-T/2,a-c,T);c=b}if(x2>c)addWall(c,y-T/2,x2-c,T)}
function vwall(x,y1,y2,gaps=[]){let c=y1;for(const[a,b]of gaps){if(a>c)addWall(x-T/2,c,T,a-c);c=b}if(y2>c)addWall(x-T/2,c,T,y2-c)}
hwall(T/2,0,W);hwall(H-T/2,0,W);vwall(T/2,0,H);vwall(W-T/2,0,H);
hwall(520,0,560,[[380,480]]);
vwall(560,0,900,[[200,310],[620,720]]);
hwall(460,560,1400,[[700,810]]);
vwall(1000,460,900,[[640,740]]);
const F=[
 {x:40,y:24,w:250,h:84,k:'couch'},
 {x:320,y:24,w:92,h:84,k:'armchair'},
 {x:486,y:24,w:56,h:56,k:'plant'},
 {x:90,y:462,w:280,h:44,k:'tv'},
 {x:574,y:14,w:620,h:62,k:'counter'},
 {x:1300,y:14,w:86,h:92,k:'fridge'},
 {x:900,y:200,w:220,h:84,k:'island'},
 {x:1334,y:398,w:44,h:44,k:'trash'},
 {x:264,y:822,w:56,h:56,k:'nstand'},
 {x:376,y:836,w:164,h:50,k:'dresser'},
 {x:290,y:540,w:74,h:50,k:'chest'},
 {x:574,y:842,w:120,h:44,k:'shoes'},
 {x:1236,y:474,w:150,h:200,k:'tub'},
 {x:1300,y:800,w:64,h:78,k:'toilet'},
 {x:1040,y:474,w:120,h:56,k:'sink'},
];
F.forEach(f=>solids.push(f));
const O=[{x:160,y:220,w:170,h:90,k:'ctable'},{x:620,y:250,w:190,h:120,k:'dtable'},{x:24,y:600,w:230,h:286,k:'bed'}];
O.forEach(o=>{const s=12,i=6;[[o.x+i,o.y+i],[o.x+o.w-i-s,o.y+i],[o.x+i,o.y+o.h-i-s],[o.x+o.w-i-s,o.y+o.h-i-s]].forEach(([x,y])=>solids.push({x,y,w:s,h:s,k:'leg'}))});
const DOCK={x:800,y:846}, SINK={x:1100,y:556};
const CAT_SPOTS=[{x:250,y:400},{x:420,y:700},{x:760,y:420},{x:1160,y:380},{x:880,y:640}];

/* ================= SAVE ================= */
const defSave=()=>({credits:0,level:1,up:{bin:0,battery:0,motor:0,brush:0,armor:0},skins:['classic'],skin:'classic',models:['round'],model:'round',mute:false});
function loadSave(){try{const s=JSON.parse(localStorage.getItem('sweepy-save')||'null');if(s){const d=defSave();return Object.assign(d,s,{up:Object.assign(d.up,s.up||{})})}}catch(e){}return defSave()}
function persist(){try{localStorage.setItem('sweepy-save',JSON.stringify(save))}catch(e){}}
let save=loadSave();

/* ================= DEFS ================= */
const UPG=[
 {id:'bin',name:'Bigger Dustbin',desc:'Hold more crumbs before you need to empty it.',costs:[60,120,200]},
 {id:'battery',name:'Long-Life Battery',desc:'Drive longer between charges.',costs:[60,120,200]},
 {id:'motor',name:'Zoom Motors',desc:'Wheels go faster.',costs:[80,150,240]},
 {id:'brush',name:'Wide Brushes',desc:'Suck up mess from farther away.',costs:[70,140,220]},
 {id:'armor',name:'Tough Bumper',desc:'More health against toy bricks and zaps.',costs:[60,120,200]},
];
const SKINS={
 classic:{name:'Classic',cost:0,body:'#F3F3F7',rim:'#A3A8BD',accent:'#2EC4B6',bumper:'#4A4D60',eye:'#1D1B2C'},
 midnight:{name:'Midnight',cost:60,body:'#2F3350',rim:'#171a2e',accent:'#7AE7FF',bumper:'#0D0E1A',eye:'#7AE7FF'},
 bumble:{name:'Bumblebee',cost:80,body:'#FFD23F',rim:'#2B2B2B',accent:'#2B2B2B',bumper:'#2B2B2B',eye:'#2B2B2B',pat:'stripes'},
 ladybug:{name:'Ladybug',cost:100,body:'#E63946',rim:'#1D1D1D',accent:'#1D1D1D',bumper:'#1D1D1D',eye:'#FFFFFF',pat:'dots'},
 panda:{name:'Panda',cost:120,body:'#FFFFFF',rim:'#26262E',accent:'#26262E',bumper:'#26262E',eye:'#FFFFFF',pat:'panda'},
 unicorn:{name:'Unicorn Sparkle',cost:160,body:'#F8C8EC',rim:'#B57EDC',accent:'#7FE0D6',bumper:'#9A63C9',eye:'#4B2A6B',pat:'sparkle'},
};
const MODELS={round:{name:'Classic Round',cost:0,desc:'Balanced and zippy.'},dshape:{name:'Corner Pro',cost:250,desc:'Flat front reaches corners: wider suction and a little faster.'}};
function stats(){const u=save.up,d=save.model==='dshape';return{speed:175+28*u.motor+(d?12:0),binMax:[30,45,60,80][u.bin],drain:[1.1,.85,.66,.5][u.battery],suck:[8,14,20,28][u.brush]+(d?8:0),maxHp:[100,130,160,200][u.armor]}}

/* ================= AUDIO ================= */
let AC=null;
function audioInit(){if(AC||save.mute)return;try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function snd(f,d=.08,type='square',v=.04,slide=0,delay=0){if(save.mute||!AC)return;try{const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
let lastBlip=0;
function blip(n){const now=performance.now();if(now-lastBlip<45)return;lastBlip=now;snd(520+n*90+Math.random()*80,.05,'square',.025,200)}

/* ================= DRAW HELPERS ================= */
function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function circ(g,x,y,r,fill){g.beginPath();g.arc(x,y,r,0,TAU);if(fill){g.fillStyle=fill;g.fill()}}
let seed=7;const srand=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};

/* ================= STATIC LAYER ================= */
const SS=2,staticC=document.createElement('canvas');staticC.width=W*SS;staticC.height=H*SS;
function floor(g,r){const{x,y,w,h}=r;
 if(r.f==='wood'||r.f==='wood2'){const base=r.f==='wood'?['#D8B07C','#CFA46E','#E0BA88']:['#E6C597','#DDBA89','#EBCDA2'];const ph=26;
  for(let yy=y,row=0;yy<y+h;yy+=ph,row++){let xx=x-((row*73)%180);while(xx<x+w){const pw=140+Math.floor(srand()*120);g.fillStyle=base[Math.floor(srand()*3)];g.fillRect(xx,yy,pw,ph);g.fillStyle='rgba(90,55,20,.2)';g.fillRect(xx,yy,1.5,ph);xx+=pw}g.fillStyle='rgba(90,55,20,.22)';g.fillRect(x,yy+ph-1.5,w,1.5)}}
 else if(r.f==='tile'){const s=56;for(let i=0;i*s<w;i++)for(let j=0;j*s<h;j++){g.fillStyle=(i+j)%2?'#EFE8DA':'#DCD2C0';g.fillRect(x+i*s,y+j*s,s,s)}}
 else if(r.f==='carpet'){g.fillStyle='#A9BCE6';g.fillRect(x,y,w,h);for(let i=0;i<2600;i++){g.fillStyle=srand()<.5?'rgba(255,255,255,.14)':'rgba(40,50,110,.1)';g.fillRect(x+srand()*w,y+srand()*h,2,2)}}
 else{g.fillStyle='#CDE9F2';g.fillRect(x,y,w,h);const s=30;g.strokeStyle='#A9D2E0';g.lineWidth=1.5;for(let i=0;i*s<w;i++)for(let j=0;j*s<h;j++){if(srand()<.06){g.fillStyle='#9FD8E6';g.fillRect(x+i*s,y+j*s,s,s)}g.strokeRect(x+i*s,y+j*s,s,s)}}
}
function furn(g,f){const{x,y,w,h}=f;
 g.fillStyle='rgba(30,15,40,.22)';rr(g,x+3,y+5,w,h,10);g.fill();
 switch(f.k){
 case 'couch':case 'armchair':{const c=f.k==='couch'?['#6C7BD9','#5563C2','#4B58B0']:['#E3A33B','#C8872A','#B57A22'];
  rr(g,x,y,w,h,14);g.fillStyle=c[0];g.fill();rr(g,x+4,y+4,w-8,26,10);g.fillStyle=c[1];g.fill();
  rr(g,x+4,y+4,20,h-8,9);g.fill();rr(g,x+w-24,y+4,20,h-8,9);g.fill();
  g.strokeStyle=c[2];g.lineWidth=2;const n=f.k==='couch'?3:1;for(let i=1;i<n;i++){const xx=x+24+i*(w-48)/n;g.beginPath();g.moveTo(xx,y+32);g.lineTo(xx,y+h-8);g.stroke()}
  if(f.k==='couch'){circ(g,x+44,y+46,11,'#F2C14E');circ(g,x+w-46,y+46,11,'#F07F8B')}break}
 case 'plant':circ(g,x+w/2,y+h/2,25,'#B8643A');circ(g,x+w/2,y+h/2,20,'#5A3A22');
  for(let i=0;i<7;i++){g.save();g.translate(x+w/2,y+h/2);g.rotate(i*TAU/7);g.fillStyle=i%2?'#4FA35A':'#6CC070';g.beginPath();g.ellipse(12,0,15,6,0,0,TAU);g.fill();g.restore()}break;
 case 'tv':rr(g,x,y,w,h,6);g.fillStyle='#7A5236';g.fill();rr(g,x+30,y+22,w-60,12,3);g.fillStyle='#1E1E28';g.fill();g.fillStyle='#3a3a50';g.fillRect(x+40,y+25,60,2);rr(g,x+8,y+10,20,24,4);g.fillStyle='#4a3324';g.fill();rr(g,x+w-28,y+10,20,24,4);g.fill();break;

function circleRect(cx,cy,r,s){const nx=clamp(cx,s.x,s.x+s.w),ny=clamp(cy,s.y,s.y+s.h);let dx=cx-nx,dy=cy-ny;const d2=dx*dx+dy*dy;if(d2>=r*r)return null;
 if(d2===0){const l=cx-s.x,rt=s.x+s.w-cx,t=cy-s.y,b=s.y+s.h-cy,m=Math.min(l,rt,t,b);if(m===l)return{x:-(l+r),y:0};if(m===rt)return{x:rt+r,y:0};if(m===t)return{x:0,y:-(t+r)};return{x:0,y:b+r}}
 const d=Math.sqrt(d2),p=r-d;return{x:dx/d*p,y:dy/d*p}}
function isFree(x,y,r){if(x<T+r||y<T+r||x>W-T-r||y>H-T-r)return false;for(const s of solids)if(circleRect(x,y,r,s))return false;return true}
function pickRoom(){const tot=rooms.reduce((a,r)=>a+r.wt,0);let v=Math.random()*tot;for(const r of rooms){v-=r.wt;if(v<=0)return r}return rooms[0]}
function freePoint(r,room){for(let i=0;i<300;i++){const a=room||pickRoom();const x=rand(a.x+T+r,a.x+a.w-T-r),y=rand(a.y+T+r,a.y+a.h-T-r);if(isFree(x,y,r+3)&&Math.hypot(x-DOCK.x,y-DOCK.y)>95&&Math.hypot(x-SINK.x,y-SINK.y)>50)return{x,y}}return{x:250,y:400}}
function collide(o,r){let hit=null;for(let k=0;k<2;k++)for(const s of solids){const p=circleRect(o.x,o.y,r,s);if(p){o.x+=p.x;o.y+=p.y;hit=p}}return hit}

function update(dt){
 G.t+=dt;const R=G.R,st=G.st,fx=G.fx;

 else if(o.k==='dtable'){rr(g,x,y,w,h,14);g.fillStyle='#B07B4F';g.fill();g.strokeStyle='#96643C';g.lineWidth=2;rr(g,x+6,y+6,w-12,h-12,10);g.stroke();for(const[a,b]of[[40,30],[150,30],[40,90],[150,90]]){circ(g,x+a,y+b,15,'#F7F4EE');circ(g,x+a,y+b,10,'#EDE6DA')}circ(g,x+95,y+60,14,'#6CC070');circ(g,x+90,y+56,5,'#E0524B');circ(g,x+100,y+63,5,'#F2C14E')}
 else{rr(g,x,y,w,h,14);g.fillStyle='#6F5690';g.fill();rr(g,x+6,y+6,w-12,h-12,10);g.fillStyle='#F4EEFF';g.fill();rr(g,x+14,y+24,58,110,16);g.fillStyle='#fff';g.fill();rr(g,x+14,y+150,58,110,16);g.fill();
  rr(g,x+84,y+10,w-94,h-20,12);g.fillStyle='#8E7CEB';g.fill();g.strokeStyle='#A898F2';g.lineWidth=2;for(let i=1;i<6;i++){g.beginPath();g.moveTo(x+84,y+10+i*(h-20)/6);g.lineTo(x+w-10,y+10+i*(h-20)/6);g.stroke()}
  circ(g,x+150,y+80,14,'#F7C6E8');circ(g,x+143,y+68,5,'#F7C6E8');circ(g,x+157,y+68,5,'#F7C6E8')}
 g.restore()}
function drawArrow(g,R,tx,ty,col,t){const d=Math.hypot(tx-R.x,ty-R.y);if(d<90)return;const a=Math.atan2(ty-R.y,tx-R.x),rad=40+Math.sin(t*6)*3;g.save();g.translate(R.x+Math.cos(a)*rad,R.y+Math.sin(a)*rad);g.rotate(a);g.beginPath();g.moveTo(10,0);g.lineTo(-6,-8);g.lineTo(-2,0);g.lineTo(-6,8);g.closePath();g.fillStyle=col;g.fill();g.strokeStyle='#221C38';g.lineWidth=2;g.stroke();g.restore()}

function draw(t){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#171230';ctx.fillRect(0,0,cw,ch);
 const vw=cw/scale,vh=ch/scale,fx0=G?G.R.x:W/2,fy0=G?G.R.y:H/2;
 const camX=vw>=W?(W-vw)/2:clamp(fx0-vw/2,0,W-vw),camY=vh>=H?(H-vh)/2:clamp(fy0-vh/2,0,H-vh);
 ctx.setTransform(dpr*scale,0,0,dpr*scale,-camX*dpr*scale,-camY*dpr*scale);
 ctx.drawImage(staticC,0,0,W,H);
 if(!G){drawStations(ctx,t);for(const o of O)drawOver(ctx,o,1);return}
 const R=G.R;
 for(const s of G.stains)drawStain(ctx,s);
 for(const p of G.trail){ctx.fillStyle=`rgba(150,210,255,${.35*(1-p.t/1.6)})`;ctx.beginPath();ctx.ellipse(p.x,p.y,10,10,0,0,TAU);ctx.fill()}
 drawStations(ctx,t);
 for(const it of G.items)drawItem(ctx,it,t);
 for(const p of G.powers)drawPower(ctx,p,t);
 if(G.cat&&G.cat.state!=='ride')drawCat(ctx,G.cat,t,false);
 for(const d of G.dogs)drawDog(ctx,d,t);
 if(G.fx.magnet){ctx.beginPath();ctx.arc(R.x,R.y,R.r+G.st.suck*2.2,0,TAU);ctx.fillStyle='rgba(240,107,170,.1)';ctx.fill();ctx.setLineDash([4,6]);ctx.strokeStyle='rgba(240,107,170,.6)';ctx.lineWidth=2;ctx.stroke();ctx.setLineDash([])}
 if(G.fx.turbo&&Math.hypot(R.vx,R.vy)>60){ctx.strokeStyle='rgba(255,138,61,.6)';ctx.lineWidth=3;ctx.lineCap='round';for(const o of[-10,0,10]){const bx=R.x-Math.cos(R.ang)*26-Math.sin(R.ang)*o,by=R.y-Math.sin(R.ang)*26+Math.cos(R.ang)*o,len=12+Math.random()*10;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx-Math.cos(R.ang)*len,by-Math.sin(R.ang)*len);ctx.stroke()}}
 const shake=R.jam>0?Math.sin(t*60)*2.5:0;
 drawBot(ctx,R.x+shake,R.y,R.ang,save.skin,save.model,R.mode==='vac'?t:t*.3,{mop:R.mode==='mop'});
 if(R.tangle>0){ctx.strokeStyle='#26222F';ctx.lineWidth=2.5;ctx.beginPath();ctx.ellipse(R.x,R.y,R.r+3,R.r-4,t*3,0,TAU);ctx.stroke()}
 if(R.hurt>0){ctx.beginPath();ctx.arc(R.x,R.y,R.r+4,0,TAU);ctx.strokeStyle=`rgba(255,90,95,${R.hurt*2})`;ctx.lineWidth=4;ctx.stroke()}
 if(G.fx.shield){ctx.beginPath();ctx.arc(R.x,R.y,R.r+9,0,TAU);ctx.fillStyle='rgba(46,196,182,.15)';ctx.fill();ctx.strokeStyle=`rgba(46,196,182,${.6+.3*Math.sin(t*8)})`;ctx.lineWidth=2.5;ctx.stroke()}
 if(G.cat&&G.cat.state==='ride')drawCat(ctx,G.cat,t,true);
 for(const o of O){const under=R.x>o.x-R.r&&R.x<o.x+o.w+R.r&&R.y>o.y-R.r&&R.y<o.y+o.h+R.r;drawOver(ctx,o,under?.32:1)}
 if(R.bin>=G.st.binMax*.95||R.bat<25)drawArrow(ctx,R,DOCK.x,DOCK.y,'#FFC857',t);
 else if(R.mode==='mop'&&R.water<5)drawArrow(ctx,R,SINK.x,SINK.y,'#5AB4FF',t);
 ctx.textAlign='center';ctx.textBaseline='middle';
 for(const p of G.pops){const k=p.t/1.1;ctx.globalAlpha=1-k*k;ctx.font=`800 ${p.size}px "Baloo 2",sans-serif`;ctx.lineWidth=4;ctx.strokeStyle='#221C38';ctx.strokeText(p.text,p.x,p.y-k*30);ctx.fillStyle=p.color;ctx.fillText(p.text,p.x,p.y-k*30)}
 ctx.globalAlpha=1;
 if(joy&&state==='play'){ctx.setTransform(dpr,0,0,dpr,0,0);circ(ctx,joy.ox,joy.oy,50,'rgba(255,246,230,.08)');ctx.strokeStyle='rgba(255,246,230,.3)';ctx.lineWidth=2;ctx.stroke();const dx=joy.x-joy.ox,dy=joy.y-joy.oy,l=Math.hypot(dx,dy),m=Math.min(l,50)/(l||1);circ(ctx,joy.ox+dx*m,joy.oy+dy*m,20,'rgba(255,200,87,.7)')}
}

/* ================= HUD ================= */
let hudTick=0,lastPw='';
const fmt=s=>{s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function setM(id,frac,txt,warn){const el=$('m-'+id);el.querySelector('i').style.width=clamp(frac,0,1)*100+'%';el.querySelector('b').textContent=txt;el.classList.toggle('warn',!!warn)}
function hud(){
 if(!G){$('wallet').innerHTML=`${save.credits}<span>credits</span>`;return}
 const R=G.R,st=G.st,pct=G.cleaned/G.total;
 setM('bat',R.bat/100,Math.ceil(R.bat)+'%',R.bat<25);
 setM('bin',R.bin/st.binMax,Math.ceil(R.bin)+'/'+st.binMax,R.bin>=st.binMax);
 setM('water',R.water/100,Math.ceil(R.water)+'%',R.mode==='mop'&&R.water<15);
 setM('hp',R.hp/st.maxHp,Math.ceil(R.hp)+'',R.hp<st.maxHp*.3);
 setM('clean',pct/.9*.9,Math.floor(pct*100)+'% · goal 90%',false);
 $('lvl').textContent=`Level ${G.L} · ${fmt(G.t)}`;
 $('wallet').innerHTML=`${save.credits}${G.runCredits?`<small>+${Math.floor(G.runCredits)}</small>`:''}<span>credits</span>`;
 const pw=Object.entries(G.fx).filter(([k,v])=>v>0).map(([k,v])=>`<span class="pw" style="--c:${POWERS[k].c}">${POWERS[k].name} ${Math.ceil(v)}s</span>`).join('')+(G.cat&&G.cat.state==='ride'?`<span class="pw" style="--c:#F0A04B">Cat ride ${Math.ceil(G.cat.t)}s</span>`:'');
 if(pw!==lastPw){$('powers').innerHTML=pw;lastPw=pw}
}

/* ================= SCREENS ================= */
const ov=$('ov'),card=$('card');let shopTab='up',resetArm=false;
function showOv(html){card.innerHTML=html;ov.hidden=false;const b=card.querySelector('.btn');b&&b.focus({preventScroll:true})}
function hideOv(){ov.hidden=true}
function showMenu(){state='menu';
 showOv(`<h1 class="title"><span>Sweepy's</span><span class="t2">Big Clean</span></h1>
 <p class="sub">Drive a little robot vacuum around the house. Slurp up crumbs, mop the spills, dodge the toy bricks, and watch out for Biscuit the dog. Pickles the cat might hitch a ride.</p>
 <div class="menu-row"><canvas class="heroBot" id="heroBot"></canvas>
 <ul class="how">
  <li><kbd>Drive</kbd><span>Arrow keys or WASD, or drag anywhere on the screen</span></li>
  <li><kbd>Space</kbd><span>Switch between Vacuum and Mop</span></li>
  <li><kbd>Vacuum</kbd><span>Crumbs, cereal, dust bunnies, dog fur and coins</span></li>
  <li><kbd>Mop</kbd><span>Juice, muddy paws and water puddles (vacuuming water goes zzzt!)</span></li>
  <li><kbd>Avoid</kbd><span>Toy bricks, socks and cables, the ones with a red glow</span></li>
  <li><kbd>Dock</kbd><span>Empties the bin, charges and fixes dents. Refill water at the bathroom sink.</span></li>
 </ul></div>
 <div class="actions"><button class="btn" data-act="play" type="button">Play level ${save.level}</button><button class="btn ghost" data-act="shop" type="button">Garage · ${save.credits} credits</button><button class="btn ghost" data-act="mute" type="button">Sound: ${save.mute?'off':'on'}</button></div>`);
 requestAnimationFrame(()=>{const c=$('heroBot');c&&drawPreview(c,save.skin,save.model,1)});hud()}
function pause(){state='pause';joy=null;showOv(`<p class="eyebrow">Paused</p><h2>Taking a breather</h2><p class="sub" style="margin-top:10px">The crumbs will wait for you.</p><div class="actions"><button class="btn" data-act="resume" type="button">Keep cleaning</button><button class="btn ghost" data-act="menu" type="button">Quit to title</button></div>`)}
function resume(){state='play';hideOv();last=performance.now()}
function fanfare(ok){const n=ok?[523,659,784,1047]:[392,330,262];n.forEach((f,i)=>snd(f,.18,'square',.045,0,i*.13))}
function complete(){state='results';joy=null;const R=G.R,st=G.st,par=120+20*(G.L-1);const s1=R.hp>=st.maxHp*.6,s2=G.t<=par;const stars=1+(s1?1:0)+(s2?1:0);
 const mess=Math.floor(G.runCredits),lb=15+5*G.L,sb=stars*10,tot=mess+lb+sb;save.credits+=tot;save.level++;persist();fanfare(true);
 showOv(`<p class="eyebrow">Level ${G.L} complete · ${fmt(G.t)}</p><h2>Squeaky clean!</h2>
 <div class="stars" aria-label="${stars} of 3 stars">${[0,1,2].map(i=>`<span class="${i<stars?'on':''}">★</span>`).join('')}</div>
 <ul class="tally"><li><span>Mess cleaned</span><b>${mess}</b></li><li><span>Level bonus</span><b>${lb}</b></li><li><span>Star bonus</span><b>${sb}</b></li><li class="tot"><span>Credits earned</span><b>${tot}</b></li></ul>
 <p class="note">Stars: 1 for finishing · 1 for keeping health above 60% ${s1?'✓':'✗'} · 1 for finishing under ${fmt(par)} ${s2?'✓':'✗'}</p>
 <div class="actions"><button class="btn" data-act="play" type="button">Next level</button><button class="btn ghost" data-act="shop" type="button">Garage · ${save.credits} credits</button></div>`)}
function fail(reason){if(state!=='play')return;state='results';joy=null;const earned=Math.floor(G.runCredits/2);save.credits+=earned;persist();fanfare(false);
 const t=reason==='battery'?['Battery died!','Sweepy ran out of juice before making it back to the dock. Keep an eye on the battery bar.']:['Sweepy broke down!','Too many toy bricks and zaps. Dodge the red-glow stuff and use the Mop on puddles.'];
 showOv(`<p class="eyebrow">Level ${G.L} · ${Math.floor(G.cleaned/G.total*100)}% clean</p><h2>${t[0]}</h2><p class="sub" style="margin-top:10px">${t[1]}</p>
 <ul class="tally"><li class="tot"><span>You still keep half your credits</span><b>${earned}</b></li></ul>
 <div class="actions"><button class="btn" data-act="play" type="button">Try again</button><button class="btn ghost" data-act="shop" type="button">Garage · ${save.credits} credits</button></div>`)}
function showShop(){state='shop';
 let body='';
 if(shopTab==='up')body=`<div class="uplist">${UPG.map(u=>{const lv=save.up[u.id],max=lv>=3,cost=u.costs[lv];return`<div class="up"><div><h3>${u.name}</h3><p>${u.desc}</p></div><div class="pips" aria-label="Level ${lv} of 3">${[0,1,2].map(i=>`<i class="${i<lv?'on':''}"></i>`).join('')}</div>${max?'<button class="btn sm ghost" disabled type="button">Maxed</button>':`<button class="btn sm" data-buy="up:${u.id}" ${save.credits<cost?'disabled':''} type="button">Buy · ${cost}</button>`}</div>`}).join('')}</div>`;
 else{const isSkin=shopTab==='skins',defs=isSkin?SKINS:MODELS,own=isSkin?save.skins:save.models,cur=isSkin?save.skin:save.model,kind=isSkin?'skin':'model';
  body=`<div class="skins">${Object.entries(defs).map(([id,d])=>{const has=own.includes(id),eq=cur===id;return`<div class="skin ${eq?'eq':''}"><canvas data-prev="${isSkin?id:save.skin}|${isSkin?save.model:id}"></canvas><h3>${d.name}</h3>${d.desc?`<p>${d.desc}</p>`:''}${eq?'<button class="btn sm ghost" disabled type="button">Equipped</button>':has?`<button class="btn sm ghost" data-equip="${kind}:${id}" type="button">Equip</button>`:`<button class="btn sm" data-buy="${kind}:${id}" ${save.credits<d.cost?'disabled':''} type="button">Buy · ${d.cost}</button>`}</div>`}).join('')}</div>`}
 showOv(`<div class="shop-head"><h2>Garage</h2><div class="wallet">${save.credits}<span>credits</span></div></div>
 <div class="tabs" role="tablist"><button class="tab ${shopTab==='up'?'on':''}" data-tab="up" type="button">Upgrades</button><button class="tab ${shopTab==='skins'?'on':''}" data-tab="skins" type="button">Skins</button><button class="tab ${shopTab==='models'?'on':''}" data-tab="models" type="button">Models</button></div>
 ${body}
 <div class="actions"><button class="btn" data-act="play" type="button">Play level ${save.level}</button><button class="btn ghost" data-act="menu" type="button">Back</button><button class="small-link" data-act="reset" type="button">${resetArm?'Tap again to erase all progress':'Reset progress'}</button></div>`);
 card.querySelectorAll('canvas[data-prev]').forEach(c=>{const[s,m]=c.dataset.prev.split('|');drawPreview(c,s,m,1)});hud()}
card.addEventListener('click',e=>{audioInit();const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.act!=='reset')resetArm=false;
 if(b.dataset.tab){shopTab=b.dataset.tab;showShop();return}
 if(b.dataset.buy){const[kind,id]=b.dataset.buy.split(':');
  if(kind==='up'){const lv=save.up[id],cost=UPG.find(u=>u.id===id).costs[lv];if(save.credits>=cost&&lv<3){save.credits-=cost;save.up[id]++}}
  else if(kind==='skin'){const c=SKINS[id].cost;if(save.credits>=c){save.credits-=c;save.skins.push(id);save.skin=id}}
  else{const c=MODELS[id].cost;if(save.credits>=c){save.credits-=c;save.models.push(id);save.model=id}}
  persist();snd(784,.08,'square',.04);snd(1047,.12,'square',.04,0,.07);showShop();return}
 if(b.dataset.equip){const[kind,id]=b.dataset.equip.split(':');if(kind==='skin')save.skin=id;else save.model=id;persist();showShop();return}
 const a=b.dataset.act;
 if(a==='play')startLevel();else if(a==='shop'){showShop()}else if(a==='menu'){showMenu()}else if(a==='resume')resume();
 else if(a==='mute'){save.mute=!save.mute;persist();if(!save.mute)audioInit();showMenu()}
 else if(a==='reset'){if(resetArm){save=defSave();persist();resetArm=false;G=null;showShop()}else{resetArm=true;showShop()}}
});

/* ================= LOOP ================= */
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 if(state==='play')update(dt);
 if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$('toast').classList.remove('show')}
 hudTick-=dt;if(hudTick<=0){hudTick=.1;hud()}
 draw(now/1000);requestAnimationFrame(frame)}
showMenu();requestAnimationFrame(frame);
})();
</script>

</body>
